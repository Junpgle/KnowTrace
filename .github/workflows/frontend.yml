name: Frontend build

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read
  statuses: write

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Show tool versions
        run: |
          node --version
          npm --version

      - name: Install frontend dependencies
        run: |
          set -o pipefail
          npm install --no-audit --no-fund 2>&1 | tee frontend-ci.log

      - name: TypeScript and Vue SFC check
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee -a frontend-ci.log

      - name: Vite production build
        run: |
          set -o pipefail
          npx vite build 2>&1 | tee -a frontend-ci.log

      - name: Surface first CI failure in commit status
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = process.env.GITHUB_WORKSPACE + '/frontend/frontend-ci.log';
            const lines = fs.existsSync(path) ? fs.readFileSync(path, 'utf8').split(/\r?\n/) : [];
            const first = lines.find(line => /(error TS\d+|error TS|npm error|npm ERR!|ERROR |Error:|\[vite\].*error|error:)/i.test(line)) || '';
            const success = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: context.sha,
              state: success ? 'success' : 'failure',
              context: 'CI/frontend-diagnostics',
              description: (success ? 'Vue typecheck and Vite build passed' : (first || 'Failed - inspect Actions logs')).slice(0, 140)
            });

      - name: Summarize successful build
        if: success()
        run: echo '### Frontend: Vue and Vite passed' >> "$GITHUB_STEP_SUMMARY"
