name: Backend tests

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "database/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "database/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: write
  statuses: write

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: backend
      KNOWTRACE_AI_PROVIDER: ollama
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show Python and pip versions
        run: |
          python --version
          python -m pip --version

      - name: Install dependencies
        run: |
          set -o pipefail
          python -m pip install -r backend/requirements-dev.txt 2>&1 | tee backend-ci.log

      - name: Compile backend Python files
        run: |
          set -o pipefail
          python -m compileall -q backend/knowtrace backend/tests 2>&1 | tee -a backend-ci.log

      - name: Run pytest with concise tracebacks
        run: |
          set -o pipefail
          python -m pytest -ra --tb=short backend/tests 2>&1 | tee -a backend-ci.log

      - name: Surface first CI failure in commit status
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = process.env.GITHUB_WORKSPACE + '/backend-ci.log';
            const lines = fs.existsSync(path) ? fs.readFileSync(path, 'utf8').split(/\r?\n/) : [];
            const first = lines.find(line => /(^E\s{2,}|^FAILED |^ERROR |SyntaxError:|ImportError:|ModuleNotFoundError:|ERROR:|error:)/.test(line)) || '';
            const success = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: context.sha,
              state: success ? 'success' : 'failure',
              context: 'CI/backend-diagnostics',
              description: (success ? 'All backend checks passed' : (first || 'Failed - inspect Actions logs')).slice(0, 140)
            });

      - name: Publish temporary backend error details
        if: failure()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = process.env.GITHUB_WORKSPACE + '/backend-ci.log';
            const lines = fs.existsSync(path) ? fs.readFileSync(path,'utf8').split(/\r?\n/) : [];
            const report = lines.slice(-180).join('\n').slice(-14000);
            const dest = '.github/ci-diagnostics/mimo-vision.txt';
            let old;
            try {
              old = await github.rest.repos.getContent({...context.repo,path:dest,ref:'main'});
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              ...context.repo, path:dest, branch:'main',
              ...(old ? {sha:old.data.sha} : {}),
              message:'ci: temporary MiMo vision test diagnosis',
              content:Buffer.from(report).toString('base64')
            });

      - name: Summarize successful tests
        if: success()
        run: |
          echo '### Backend: Python and pytest passed' >> "$GITHUB_STEP_SUMMARY"
